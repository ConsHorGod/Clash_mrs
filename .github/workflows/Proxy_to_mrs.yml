name: Update Proxy MRS

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl gzip python3 python3-yaml

      - name: Download latest mihomo
        shell: bash
        run: |
          set -e

          mkdir -p tools

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '
              .assets[]
              | select(
                  .name
                  | test("^mihomo-linux-amd64-compatible-v.*\\.gz$")
                )
              | .browser_download_url
            ' \
            | head -n 1)

          if [ -z "$URL" ]; then
            echo "找不到 mihomo Linux amd64 compatible 版本"
            exit 1
          fi

          echo "下载：$URL"

          curl -fL "$URL" -o tools/mihomo.gz
          gunzip -f tools/mihomo.gz
          chmod +x tools/mihomo

          ./tools/mihomo -v

      - name: Download Proxy_Classical.yaml
        run: |
          mkdir -p source

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Proxy/Proxy_Classical.yaml" \
            -o source/Proxy_Classical.yaml

      - name: Extract Domain rules
        run: |
          python3 <<'PY'
          import yaml

          INPUT = "source/Proxy_Classical.yaml"
          OUTPUT = "source/Proxy_Domain.yaml"

          with open(INPUT, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          payload = data.get("payload", [])

          domains = []
          seen = set()

          for rule in payload:
              rule = str(rule).strip()

              if not rule:
                  continue

              if rule.startswith("DOMAIN,"):
                  value = rule.split(",", 1)[1].strip()

              elif rule.startswith("DOMAIN-SUFFIX,"):
                  value = rule.split(",", 1)[1].strip()

              else:
                  continue

              if not value:
                  continue

              value = value.lower()

              if value not in seen:
                  seen.add(value)
                  domains.append(value)

          if not domains:
              raise SystemExit("没有找到任何有效 Domain 规则")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for domain in domains:
                  f.write(f"  - {domain}\n")

          print(f"Domain rules: {len(domains)}")
          PY

      - name: Extract IP rules
        run: |
          python3 <<'PY'
          import yaml
          import ipaddress

          INPUT = "source/Proxy_Classical.yaml"
          OUTPUT = "source/Proxy_IP.yaml"

          with open(INPUT, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          payload = data.get("payload", [])

          ip_rules = []
          seen = set()

          for rule in payload:
              rule = str(rule).strip()

              if not rule:
                  continue

              if rule.startswith("IP-CIDR,"):
                  value = rule.split(",", 1)[1].strip()

              elif rule.startswith("IP-CIDR6,"):
                  value = rule.split(",", 1)[1].strip()

              else:
                  continue

              if not value:
                  continue

              try:
                  network = ipaddress.ip_network(value, strict=False)
                  value = str(network)
              except ValueError:
                  print(f"跳过无效 CIDR: {value}")
                  continue

              if value not in seen:
                  seen.add(value)
                  ip_rules.append(value)

          if not ip_rules:
              raise SystemExit("没有找到任何有效 IP-CIDR 规则")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for cidr in ip_rules:
                  f.write(f"  - {cidr}\n")

          print(f"IP rules: {len(ip_rules)}")
          PY

      - name: Convert Domain to MRS
        run: |
          set -e

          mkdir -p output

          ./tools/mihomo convert-ruleset \
            domain \
            yaml \
            source/Proxy_Domain.yaml \
            output/Proxy_Domain.mrs

      - name: Convert IP to MRS
        run: |
          set -e

          mkdir -p output

          ./tools/mihomo convert-ruleset \
            ipcidr \
            yaml \
            source/Proxy_IP.yaml \
            output/Proxy_IP.mrs

      - name: Check output
        run: |
          set -e

          echo "========== MRS =========="
          ls -lh output/

          echo
          echo "========== SHA256 =========="
          sha256sum output/*.mrs

          echo
          echo "========== Domain =========="
          grep -c "^  -" source/Proxy_Domain.yaml || true

          echo
          echo "========== IP =========="
          grep -c "^  -" source/Proxy_IP.yaml || true

          echo
          echo "========== 文件大小 =========="
          stat -c "%n %s bytes" output/*.mrs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/*.mrs

          if git diff --cached --quiet; then
            echo "Proxy 规则没有变化，不提交"
            exit 0
          fi

          git commit -m "chore: update Proxy MRS"
          git push

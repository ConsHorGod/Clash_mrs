name: Update my_all MRS
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download rules
        run: |
          set -e
          mkdir -p ruleset
          echo "===== Download ChinaMax ====="
          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_Domain.txt" \
            -o /tmp/ChinaMax_Domain.txt
          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_IP.txt" \
            -o /tmp/ChinaMax_IP.txt
          echo "===== Download custom rules ====="
          curl -fL \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_DIRECT.txt" \
            -o /tmp/Clash_DIRECT.txt
          curl -fL \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_PROXY.txt" \
            -o /tmp/Clash_PROXY.txt
          curl -fL \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_REJECT.txt" \
            -o /tmp/Clash_REJECT.txt
          echo ""
          echo "===== Download check ====="
          for file in \
            /tmp/ChinaMax_Domain.txt \
            /tmp/ChinaMax_IP.txt \
            /tmp/Clash_DIRECT.txt \
            /tmp/Clash_PROXY.txt \
            /tmp/Clash_REJECT.txt
          do
            echo "$(basename "$file"): $(wc -l < "$file") lines, $(stat -c%s "$file") bytes"
          done
      - name: Download latest mihomo
        run: |
          set -e
          echo "===== Get latest mihomo ====="
          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          VERSION=$(curl -fsSL "$API" | jq -r '.tag_name')
          URL=$(curl -fsSL "$API" \
            | jq -r '.assets[].browser_download_url' \
            | grep -E '/mihomo-linux-amd64(-compatible)?-.*\.gz$' \
            | head -n 1)
          if [ -z "$URL" ]; then
            echo "ERROR: Cannot find mihomo Linux AMD64 download."
            exit 1
          fi
          echo "Mihomo version: $VERSION"
          echo "Download URL: $URL"
          curl -fL "$URL" -o /tmp/mihomo.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          echo ""
          echo "===== Mihomo version ====="
          /tmp/mihomo -v
      - name: Convert ChinaMax Domain to MRS
        run: |
          set -e
          python3 - <<'PY'
          import re
          src = "/tmp/ChinaMax_Domain.txt"
          out = "/tmp/ChinaMax_Domain.yaml"
          domains = set()
          with open(src, "r", encoding="utf-8-sig") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  # 去除 YAML 列表符号
                  line = re.sub(r"^\s*-\s*", "", line)
                  # 去除行尾注释
                  line = re.sub(r"\s+#.*$", "", line)
                  line = line.strip()
                  # DOMAIN-SUFFIX
                  m = re.match(
                      r"^DOMAIN-SUFFIX\s*,\s*([^,\s]+)",
                      line,
                      re.I
                  )
                  if m:
                      domains.add(m.group(1).strip())
                      continue
                  # DOMAIN
                  m = re.match(
                      r"^DOMAIN\s*,\s*([^,\s]+)",
                      line,
                      re.I
                  )
                  if m:
                      domains.add(m.group(1).strip())
                      continue
                  # 单独域名
                  if "," not in line and "/" not in line:
                      domains.add(line)
          if not domains:
              raise RuntimeError("ChinaMax_Domain 没有解析到任何域名规则")
          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')
          print(f"ChinaMax_Domain: {len(domains)} domain rules")
          PY
          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/ChinaMax_Domain.yaml \
            ruleset/ChinaMax_Domain.mrs
      - name: Convert ChinaMax IP to MRS
        run: |
          set -e
          python3 - <<'PY'
          import re
          src = "/tmp/ChinaMax_IP.txt"
          out = "/tmp/ChinaMax_IP.yaml"
          cidrs = set()
          with open(src, "r", encoding="utf-8-sig") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  # 去除 YAML 列表符号
                  line = re.sub(r"^\s*-\s*", "", line)
                  # 去除行尾注释
                  line = re.sub(r"\s+#.*$", "", line)
                  line = line.strip()
                  # IP-CIDR / IP-CIDR6
                  m = re.match(
                      r"^IP-CIDR6?\s*,\s*(.+?)(?:\s*,.*)?$",
                      line,
                      re.I
                  )
                  if m:
                      cidrs.add(m.group(1).strip())
                      continue
                  # 直接 IPv4 CIDR
                  if re.match(
                      r"^(?:\d{1,3}\.){3}\d{1,3}/\d{1,2}$",
                      line
                  ):
                      cidrs.add(line)
                      continue
                  # 直接 IPv6 CIDR
                  if ":" in line and "/" in line:
                      cidrs.add(line)
          if not cidrs:
              raise RuntimeError("ChinaMax_IP 没有解析到任何 IP/CIDR 规则")
          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for cidr in sorted(cidrs):
                  f.write(f'  - "{cidr}"\n')
          print(f"ChinaMax_IP: {len(cidrs)} IP/CIDR rules")
          PY
          /tmp/mihomo convert-ruleset ipcidr yaml \
            /tmp/ChinaMax_IP.yaml \
            ruleset/ChinaMax_IP.mrs
      - name: Convert custom TXT to MRS
        run: |
          set -e
          python3 - <<'PY'
          import re
          files = [
              ("Clash_DIRECT.txt", "Clash_DIRECT.yaml"),
              ("Clash_PROXY.txt", "Clash_PROXY.yaml"),
              ("Clash_REJECT.txt", "Clash_REJECT.yaml"),
          ]
          for src_name, out_name in files:
              src = "/tmp/" + src_name
              out = "/tmp/" + out_name
              domains = set()
              with open(src, "r", encoding="utf-8-sig") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      # 去除 YAML 列表符号
                      # - DOMAIN,...
                      # - DOMAIN-SUFFIX,...
                      line = re.sub(r"^\s*-\s*", "", line)
                      # 去除行尾注释
                      # DOMAIN-SUFFIX,example.com # comment
                      line = re.sub(r"\s+#.*$", "", line)
                      line = line.strip()
                      # DOMAIN-SUFFIX
                      m = re.match(
                          r"^DOMAIN-SUFFIX\s*,\s*([^,\s]+)",
                          line,
                          re.I
                      )
                      if m:
                          domain = m.group(1).strip()
                          if domain:
                              domains.add(domain)
                          continue
                      # DOMAIN
                      m = re.match(
                          r"^DOMAIN\s*,\s*([^,\s]+)",
                          line,
                          re.I
                      )
                      if m:
                          domain = m.group(1).strip()
                          if domain:
                              domains.add(domain)
                          continue
                      # 单独域名
                      if "," not in line and "/" not in line:
                          domains.add(line)
              if not domains:
                  raise RuntimeError(
                      f"{src_name} 没有解析到任何 DOMAIN / DOMAIN-SUFFIX 规则"
                  )
              with open(out, "w", encoding="utf-8") as f:
                  f.write("payload:\n")
                  for domain in sorted(domains):
                      f.write(f'  - "{domain}"\n')
              print(f"{src_name}: {len(domains)} domain rules")
          PY
          echo ""
          echo "===== Convert DIRECT ====="
          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Clash_DIRECT.yaml \
            ruleset/Clash_DIRECT.mrs
          echo ""
          echo "===== Convert PROXY ====="
          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Clash_PROXY.yaml \
            ruleset/Clash_PROXY.mrs
          echo ""
          echo "===== Convert REJECT ====="
          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Clash_REJECT.yaml \
            ruleset/Clash_REJECT.mrs
      - name: Check output
        run: |
          set -e
          echo "================================"
          echo "        Generated MRS"
          echo "================================"
          ls -lh ruleset/*.mrs
          echo ""
          echo "================================"
          echo "        File sizes"
          echo "================================"
          du -h ruleset/*.mrs
          echo ""
          echo "================================"
          echo "        File count"
          echo "================================"
          COUNT=$(find ruleset -maxdepth 1 -name "*.mrs" | wc -l)
          echo "MRS count: $COUNT"
          if [ "$COUNT" -ne 5 ]; then
            echo "ERROR: Expected 5 MRS files."
            exit 1
          fi
          echo ""
          echo "All 5 MRS files generated successfully."
      - name: Commit changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/ChinaMax_Domain.mrs
          git add ruleset/ChinaMax_IP.mrs
          git add ruleset/Clash_DIRECT.mrs
          git add ruleset/Clash_PROXY.mrs
          git add ruleset/Clash_REJECT.mrs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ChinaMax and custom MRS"
            git push
          fi
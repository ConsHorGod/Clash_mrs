name: Update My_all MRS

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rules
        run: |
          mkdir -p ruleset

          echo "===== Download ChinaMax ====="

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_Domain.txt" \
            -o /tmp/ChinaMax_Domain.txt

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_IP.txt" \
            -o /tmp/ChinaMax_IP.txt

          echo "===== Download custom rules ====="

          curl -fL \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_DIRECT.txt" \
            -o /tmp/Clash_DIRECT.txt

          curl -fL \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_PROXY.txt" \
            -o /tmp/Clash_PROXY.txt

          curl -fL \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/配置文件/Clash_REJECT.txt" \
            -o /tmp/Clash_REJECT.txt

          echo "===== Download check ====="

          echo "ChinaMax_Domain:"
          wc -l /tmp/ChinaMax_Domain.txt

          echo "ChinaMax_IP:"
          wc -l /tmp/ChinaMax_IP.txt

          echo "Clash_DIRECT:"
          wc -l /tmp/Clash_DIRECT.txt

          echo "Clash_PROXY:"
          wc -l /tmp/Clash_PROXY.txt

          echo "Clash_REJECT:"
          wc -l /tmp/Clash_REJECT.txt

      - name: Download mihomo
        run: |
          echo "===== Get latest mihomo ====="

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[].browser_download_url' \
            | grep 'linux-amd64' \
            | grep -E '\.gz$' \
            | head -n 1)

          echo "Version: ${VERSION}"
          echo "URL: ${URL}"

          test -n "$URL"

          curl -fL "$URL" -o /tmp/mihomo.gz

          gunzip -f /tmp/mihomo.gz

          chmod +x /tmp/mihomo

          /tmp/mihomo -v

      - name: Convert ChinaMax Domain to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/ChinaMax_Domain.txt"
          out = "/tmp/ChinaMax_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^DOMAIN-SUFFIX,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).split(",")[0].strip())
                      continue

                  m = re.match(r"^DOMAIN,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).split(",")[0].strip())
                      continue

                  if "," not in line and "/" not in line:
                      domains.add(line)

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"ChinaMax Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/ChinaMax_Domain.yaml \
            ruleset/ChinaMax_Domain.mrs

      - name: Convert ChinaMax IP to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/ChinaMax_IP.txt"
          out = "/tmp/ChinaMax_IP.yaml"

          cidrs = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^IP-CIDR6?,(.+?)(?:,.*)?$", line, re.I)
                  if m:
                      cidrs.add(m.group(1).strip())
                      continue

                  if re.match(
                      r"^(?:\d{1,3}\.){3}\d{1,3}/\d{1,2}$",
                      line
                  ):
                      cidrs.add(line)
                      continue

                  if ":" in line and "/" in line:
                      cidrs.add(line)

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for cidr in sorted(cidrs):
                  f.write(f'  - "{cidr}"\n')

          print(f"ChinaMax IP rules: {len(cidrs)}")
          PY

          /tmp/mihomo convert-ruleset ipcidr yaml \
            /tmp/ChinaMax_IP.yaml \
            ruleset/ChinaMax_IP.mrs

      - name: Convert custom Domain rules to MRS
        run: |
          python3 - <<'PY'
          import re

          files = [
              ("Clash_DIRECT.txt", "Clash_DIRECT.yaml"),
              ("Clash_PROXY.txt", "Clash_PROXY.yaml"),
              ("Clash_REJECT.txt", "Clash_REJECT.yaml"),
          ]

          for src_name, out_name in files:
              src = "/tmp/" + src_name
              out = "/tmp/" + out_name

              domains = set()

              with open(src, "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()

                      if not line or line.startswith("#"):
                          continue

                      # DOMAIN-SUFFIX,example.com
                      m = re.match(r"^DOMAIN-SUFFIX,(.+)$", line, re.I)
                      if m:
                          domain = m.group(1).split(",")[0].strip()
                          if domain:
                              domains.add(domain)
                          continue

                      # DOMAIN,example.com
                      m = re.match(r"^DOMAIN,(.+)$", line, re.I)
                      if m:
                          domain = m.group(1).split(",")[0].strip()
                          if domain:
                              domains.add(domain)
                          continue

                      # 单独域名
                      if "," not in line and "/" not in line:
                          domains.add(line)

              with open(out, "w", encoding="utf-8") as f:
                  f.write("payload:\n")
                  for domain in sorted(domains):
                      f.write(f'  - "{domain}"\n')

              print(f"{src_name}: {len(domains)} domain rules")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Clash_DIRECT.yaml \
            ruleset/Clash_DIRECT.mrs

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Clash_PROXY.yaml \
            ruleset/Clash_PROXY.mrs

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Clash_REJECT.yaml \
            ruleset/Clash_REJECT.mrs

      - name: Check MRS files
        run: |
          echo "===== MRS files ====="

          ls -lh ruleset/*.mrs

          echo ""
          echo "===== MRS sizes ====="

          du -h ruleset/*.mrs

          echo ""
          echo "===== File count ====="

          find ruleset -name "*.mrs" | wc -l

          echo ""
          echo "Expected: 5 MRS files"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/ChinaMax_Domain.mrs
          git add ruleset/ChinaMax_IP.mrs
          git add ruleset/Clash_DIRECT.mrs
          git add ruleset/Clash_PROXY.mrs
          git add ruleset/Clash_REJECT.mrs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ChinaMax and custom MRS"
            git push
          fi